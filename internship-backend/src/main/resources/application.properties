server.port=8080

spring.application.name=internship-management

# --- MySQL database "internship_db" ---
spring.datasource.url=jdbc:mysql://localhost:3306/internship_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=true

app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUseOnly1234567890
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200

# Where generated certificate PDFs are written on disk. Change to an absolute,
# persistent path in production (this relative path is fine for local dev).
app.storage.certificates-dir=./data/certificates
